name: Publish to AMO

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The release tag is the version: write it into the build, nothing is committed.
      - name: Set version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm version "$version" --no-git-tag-version --allow-same-version
          node -e "const fs = require('fs'); const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8')); m.version = process.argv[1]; fs.writeFileSync('manifest.json', JSON.stringify(m, null, 2) + '\n')" "$version"

      - run: npm test
      - run: npx web-ext lint --source-dir .

      - id: build
        run: npm run build

      - name: Sign and submit
        run: |
          npx web-ext sign --source-dir . --artifacts-dir dist --channel listed \
            --ignore-files docs node_modules test scripts dist .profile eslint.config.js package-lock.json amo-metadata.json \
            --amo-metadata amo-metadata.json \
            --api-key "${{ secrets.AMO_JWT_ISSUER }}" \
            --api-secret "${{ secrets.AMO_JWT_SECRET }}"

      - name: Attach .zip and signed .xpi to release
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.zip $(ls dist/*.xpi 2>/dev/null) --clobber
        env:
          GH_TOKEN: ${{ github.token }}
